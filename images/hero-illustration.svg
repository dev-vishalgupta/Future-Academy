<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%" fill="none">
    <defs>
        <!-- Gradients -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.04"/>
        </linearGradient>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>
        <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
        </linearGradient>

        <!-- Drop Shadows -->
        <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
        <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Background Atmospheric Blob -->
    <ellipse cx="350" cy="270" rx="300" ry="210" fill="url(#bgGrad)"/>
    <circle cx="560" cy="120" r="80" fill="url(#glowGrad)"/>
    <circle cx="140" cy="380" r="90" fill="url(#glowGrad)"/>

    <!-- Geometric Grid Lines & STEM Accents -->
    <g opacity="0.4" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4">
        <circle cx="350" cy="260" r="190"/>
        <circle cx="350" cy="260" r="130"/>
        <line x1="160" y1="260" x2="540" y2="260"/>
        <line x1="350" y1="70" x2="350" y2="450"/>
    </g>

    <!-- Physics Orbit Rings (Science Theme) -->
    <g transform="translate(350, 240) rotate(-25)">
        <ellipse cx="0" cy="0" rx="160" ry="50" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
        <circle cx="160" cy="0" r="7" fill="#2563eb" filter="url(#softShadow)"/>
        <circle cx="-160" cy="0" r="5" fill="#f59e0b"/>
    </g>
    <g transform="translate(350, 240) rotate(35)">
        <ellipse cx="0" cy="0" rx="160" ry="50" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
        <circle cx="0" cy="50" r="6" fill="#10b981" filter="url(#softShadow)"/>
        <circle cx="0" cy="-50" r="5" fill="#6366f1"/>
    </g>

    <!-- Main Desk / Base Platform -->
    <ellipse cx="350" cy="420" rx="240" ry="40" fill="#e2e8f0" opacity="0.7"/>
    <ellipse cx="350" cy="415" rx="210" ry="30" fill="#ffffff" filter="url(#softShadow)"/>

    <!-- Central Tech Learning Device (Tablet / Monitor Frame) -->
    <g filter="url(#softShadow)">
        <!-- Monitor Stand -->
        <path d="M335 375 L365 375 L375 410 L325 410 Z" fill="#cbd5e1"/>
        <rect x="310" y="408" width="80" height="8" rx="4" fill="#94a3b8"/>
        
        <!-- Screen Outer Bezel -->
        <rect x="220" y="150" width="260" height="190" rx="16" fill="url(#screenGrad)"/>
        <rect x="226" y="156" width="248" height="178" rx="12" fill="#0f172a"/>
        
        <!-- Classroom Header Bar -->
        <rect x="236" y="168" width="228" height="24" rx="6" fill="#1e293b"/>
        <circle cx="250" cy="180" r="4" fill="#ef4444"/>
        <circle cx="262" cy="180" r="4" fill="#f59e0b"/>
        <circle cx="274" cy="180" r="4" fill="#10b981"/>
        <rect x="290" y="176" width="90" height="8" rx="4" fill="#334155"/>
        
        <!-- Live Teacher Lecture / Video Stream -->
        <rect x="236" y="200" width="130" height="120" rx="8" fill="#1e293b"/>
        <!-- Instructor Avatar Profile -->
        <circle cx="301" cy="245" r="22" fill="#3b82f6" opacity="0.3"/>
        <circle cx="301" cy="240" r="14" fill="#fcd34d"/>
        <path d="M285 272 C285 258 317 258 317 272 Z" fill="#2563eb"/>
        <!-- Live Badge -->
        <rect x="244" y="208" width="42" height="14" rx="4" fill="#ef4444"/>
        <text x="265" y="218" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LIVE</text>
        
        <!-- Mathematical Formula Graphs on Board -->
        <rect x="374" y="200" width="90" height="55" rx="6" fill="#1e293b"/>
        <path d="M382 238 Q396 215 410 230 T438 215 T456 240" stroke="#38bdf8" stroke-width="2" fill="none"/>
        <text x="382" y="214" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#94a3b8">f(x) = sin(x)</text>

        <!-- Formulas Box -->
        <rect x="374" y="262" width="90" height="58" rx="6" fill="#1e293b"/>
        <text x="382" y="280" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#fcd34d">∫ 2x dx = x²</text>
        <text x="382" y="296" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#a7f3d0">E = mc²</text>
        <text x="382" y="312" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#60a5fa">Δx · Δp ≥ ℏ/2</text>
    </g>

    <!-- Books & Learning Tools Stack (Left Side) -->
    <g filter="url(#softShadow)">
        <!-- Book 1 (Blue) -->
        <path d="M120 380 L205 380 L200 398 L115 398 Z" fill="#1e40af"/>
        <rect x="115" y="396" width="90" height="6" rx="2" fill="#3b82f6"/>
        <!-- Book 2 (Green) -->
        <path d="M125 362 L200 362 L195 380 L120 380 Z" fill="#047857"/>
        <rect x="120" y="378" width="80" height="6" rx="2" fill="#10b981"/>
        <!-- Book 3 (Orange - Math) -->
        <path d="M110 342 L190 342 L185 362 L105 362 Z" fill="#b45309"/>
        <rect x="105" y="360" width="85" height="6" rx="2" fill="#f59e0b"/>
        <!-- Book Spine Label -->
        <text x="140" y="356" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#ffffff">MATH</text>
        <!-- Apple on books -->
        <circle cx="150" cy="330" r="10" fill="#ef4444"/>
        <path d="M150 320 Q152 315 155 316" stroke="#15803d" stroke-width="2" fill="none"/>
        <ellipse cx="154" cy="316" rx="3" ry="1.5" fill="#22c55e"/>
    </g>

    <!-- Chemistry Flask / Science Element (Right Side) -->
    <g filter="url(#softShadow)">
        <path d="M545 350 L555 350 L555 370 L575 405 C580 415 572 425 560 425 L530 425 C518 425 510 415 515 405 L535 370 L535 350 Z" fill="#e0f2fe" opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
        <!-- Liquid Level -->
        <path d="M523 395 C535 390 550 400 567 395 L565 415 C565 420 560 422 555 422 L535 422 C530 422 525 420 525 415 Z" fill="#38bdf8"/>
        <!-- Bubbles -->
        <circle cx="540" cy="405" r="3" fill="#ffffff" opacity="0.8"/>
        <circle cx="550" cy="398" r="2" fill="#ffffff" opacity="0.8"/>
        <circle cx="544" cy="385" r="2.5" fill="#38bdf8" opacity="0.7"/>
    </g>

    <!-- Floating Badge 1: 100% Concept Clarity (Top Left) -->
    <g filter="url(#softShadow)">
        <rect x="60" y="90" width="165" height="54" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="90" cy="117" r="18" fill="#eff6ff"/>
        <text x="90" y="123" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">📐</text>
        <text x="118" y="112" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Concept First</text>
        <text x="118" y="128" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748b">Math &amp; Science Core</text>
    </g>

    <!-- Floating Badge 2: 10+ Years Mentorship (Top Right) -->
    <g filter="url(#softShadow)">
        <rect x="475" y="70" width="170" height="54" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="505" cy="97" r="18" fill="#fef3c7"/>
        <text x="505" y="103" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">⭐</text>
        <text x="533" y="92" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">10+ Yrs Mentorship</text>
        <text x="533" y="108" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748b">By Nawlesh Sir</text>
    </g>

    <!-- Floating Badge 3: Board Exam Target (Bottom Right) -->
    <g filter="url(#softShadow)">
        <rect x="490" y="270" width="160" height="52" rx="14" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="518" cy="296" r="18" fill="#ecfdf5"/>
        <text x="518" y="302" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">🎯</text>
        <text x="544" y="291" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Board Excellence</text>
        <text x="544" y="306" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#059669">BSEB &amp; CBSE 8th–12th</text>
    </g>

    <!-- Floating Sparkles & Math Symbols -->
    <g fill="#2563eb" opacity="0.75">
        <!-- Sparkle 1 -->
        <path d="M210 70 Q215 80 225 85 Q215 90 210 100 Q205 90 195 85 Q205 80 210 70 Z"/>
        <!-- Sparkle 2 -->
        <path d="M470 210 Q474 218 482 222 Q474 226 470 234 Q466 226 458 222 Q466 218 470 210 Z" fill="#f59e0b"/>
        <!-- Sparkle 3 -->
        <path d="M120 240 Q123 246 129 249 Q123 252 120 258 Q117 252 111 249 Q117 246 120 240 Z" fill="#10b981"/>
    </g>

    <!-- Pi and Sigma Floating Symbols -->
    <text x="180" y="210" font-family="serif" font-size="24" font-weight="bold" fill="#3b82f6" opacity="0.5">π</text>
    <text x="510" y="210" font-family="serif" font-size="26" font-weight="bold" fill="#8b5cf6" opacity="0.5">∑</text>
    <text x="280" y="120" font-family="serif" font-size="22" font-weight="bold" fill="#f59e0b" opacity="0.6">√x</text>
    <text x="430" y="110" font-family="serif" font-size="20" font-weight="bold" fill="#10b981" opacity="0.6">∞</text>
</svg>
